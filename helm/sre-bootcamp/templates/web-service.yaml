apiVersion: v1
kind: Service
metadata:
  name: sre-bootcamp-web
  namespace: {{ .Values.namespace }}
  labels:
    app: sre-bootcamp-web
    {{- include "sre-bootcamp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: sre-bootcamp-web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
