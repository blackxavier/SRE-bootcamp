apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-bootcamp-web
  namespace: sre-bootcamp
  labels:
    app: sre-bootcamp-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-bootcamp-web
  template:
    metadata:
      labels:
        app: sre-bootcamp-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      # -------------------------------------------------------------------------
      # initContainer: Decoupled Database Migrations
      # Runs sequentially to completion BEFORE the web container is started.
      # -------------------------------------------------------------------------
      initContainers:
        - name: run-migrations
          image: ghcr.io/blackxavier/sre-bootcamp-web:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: DB_HOST
              value: "db"
            - name: DB_PORT
              value: "5432"

      # -------------------------------------------------------------------------
      # Main Application Container: Gunicorn WSGI Web Server
      # -------------------------------------------------------------------------
      containers:
        - name: web
          image: ghcr.io/blackxavier/sre-bootcamp-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: DEBUG
              value: "False"
            - name: RUN_MIGRATIONS
              value: "false"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: DB_HOST
              value: "db"
            - name: DB_PORT
              value: "5432"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
