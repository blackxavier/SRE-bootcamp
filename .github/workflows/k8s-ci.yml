name: CI - Build and Deploy to Kubernetes

on:
  push:
    branches:
      - kubernetes
      - helm-setup
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: sre-bootcamp-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_sre_bootcamp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django tests
        env:
          DB_NAME: test_sre_bootcamp
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
        run: uv run python manage.py test --verbosity=2

      - name: Trivy filesystem scan (code/config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy filesystem results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Helm lint
        run: helm lint helm/sre-bootcamp

      - name: Helm template (dry-run render)
        run: |
          helm template sre-bootcamp helm/sre-bootcamp \
            --set web.image.tag=ci-test \
            --debug

  build-and-push:
    needs: [test, helm-validate]
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.vars.outputs.image-tag }}

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##refs/tags/}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "image-tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            .

      - name: Trivy image scan (app image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image-tag }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Push image to Docker Hub
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package and push Helm chart to GHCR
        run: |
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}
          helm package helm/sre-bootcamp
          helm push sre-bootcamp-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/kubernetes' || github.ref == 'refs/heads/helm-setup'

    steps:
      - name: Deploy to Minikube cluster on EC2 via Helm
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_K8S_HOST }}
          username: ${{ secrets.EC2_K8S_USER }}
          key: ${{ secrets.EC2_K8S_SSH_KEY }}
          script: |
            set -e

            # Validate kubectl connectivity
            minikube kubectl -- cluster-info

            # Install Helm if not present
            if ! command -v helm &>/dev/null; then
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            fi

            # Point Helm at the minikube cluster
            export KUBECONFIG="${HOME}/.kube/config"
            kubectl config use-context minikube

            # Ensure namespace exists before creating the secret
            minikube kubectl -- apply -f - <<'NSEOF'
            apiVersion: v1
            kind: Namespace
            metadata:
              name: sre-bootcamp
            NSEOF

            # Create or update DB credentials secret
            minikube kubectl -- -n sre-bootcamp create secret generic db-credentials \
              --from-literal=DB_NAME='${{ secrets.DB_NAME }}' \
              --from-literal=DB_USER='${{ secrets.DB_USER }}' \
              --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              --dry-run=client -o yaml | minikube kubectl -- apply -f -

            # Log Helm into GHCR so it can pull the chart
            helm registry login ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GITHUB_TOKEN }}

            # Pull and install/upgrade the chart from the OCI registry.
            # --set web.image.tag pins the exact image built in this pipeline run.
            IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            helm upgrade --install sre-bootcamp \
              oci://ghcr.io/${{ github.repository_owner }}/charts/sre-bootcamp \
              --version 0.1.0 \
              --namespace sre-bootcamp \
              --set web.image.tag="${IMAGE_TAG}" \
              --wait \
              --timeout=5m