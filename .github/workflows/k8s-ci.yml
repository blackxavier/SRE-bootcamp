name: CI - Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - dev
      - k8s-deploy
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: sre-bootcamp-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_sre_bootcamp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django tests
        env:
          DB_NAME: test_sre_bootcamp
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
        run: uv run python manage.py test --verbosity=2

      - name: Trivy filesystem scan (code/config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy filesystem results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.vars.outputs.image-tag }}
      owner-lc: ${{ steps.vars.outputs.owner-lc }}

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute build variables
        id: vars
        run: |
          # Lowercase owner for OCI / Docker repository compatibility
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> "$GITHUB_ENV"
          echo "owner-lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

          # Compute image tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##refs/tags/}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "image-tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          TAGS="-t ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            TAGS="${TAGS} -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          fi
          docker build ${TAGS} .

      - name: Trivy image scan (app image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ steps.vars.outputs.owner-lc }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image-tag }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Push image to GHCR
        run: docker push ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}

      - name: Push image to Docker Hub (Optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}

  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/k8s-deploy' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_K8S_HOST }}
          username: ${{ secrets.EC2_K8S_USER }}
          key: ${{ secrets.EC2_K8S_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/srv/sre-bootcamp-k8s"
            if mkdir -p "${DEPLOY_DIR}" 2>/dev/null; then
              true
            else
              sudo mkdir -p "${DEPLOY_DIR}"
              sudo chown "${USER}:${USER}" "${DEPLOY_DIR}"
            fi

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_K8S_HOST }}
          username: ${{ secrets.EC2_K8S_USER }}
          key: ${{ secrets.EC2_K8S_SSH_KEY }}
          source: "k8s/*"
          target: "/srv/sre-bootcamp-k8s"

      - name: Deploy to Minikube cluster on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_K8S_HOST }}
          username: ${{ secrets.EC2_K8S_USER }}
          key: ${{ secrets.EC2_K8S_SSH_KEY }}
          script: |
            set -e
            cd /srv/sre-bootcamp-k8s

            OWNER_LC="${{ needs.build-and-push.outputs.owner-lc }}"
            IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            WEB_IMAGE="ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

            # Validate cluster connectivity via minikube
            minikube status -p sre-bootcamp || minikube status

            # Ensure kubeconfig context is active for minikube
            minikube update-context -p sre-bootcamp 2>/dev/null || minikube update-context 2>/dev/null || true
            export KUBECONFIG="${HOME}/.kube/config"

            # 1. Apply namespace first
            minikube kubectl -- apply -f k8s/namespace.yml

            # 2. Create or update DB credentials secret from GitHub Secrets
            minikube kubectl -- -n sre-bootcamp create secret generic db-credentials \
              --from-literal=DB_NAME='${{ secrets.DB_NAME }}' \
              --from-literal=DB_USER='${{ secrets.DB_USER }}' \
              --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              --dry-run=client -o yaml | minikube kubectl -- apply -f -

            # 3. Create or update GHCR image pull secret
            minikube kubectl -- -n sre-bootcamp create secret docker-registry ghcr-cred \
              --docker-server=ghcr.io \
              --docker-username='${{ github.actor }}' \
              --docker-password='${{ secrets.GITHUB_TOKEN }}' \
              --docker-email='bot@sre-bootcamp.local' \
              --dry-run=client -o yaml | minikube kubectl -- apply -f -

            # 4. Attach ghcr-cred to default serviceaccount so pods pull without imagePullSecrets blocks
            minikube kubectl -- -n sre-bootcamp patch serviceaccount default \
              -p '{"imagePullSecrets": [{"name": "ghcr-cred"}]}' 2>/dev/null || true

            # 5. Apply base workload and networking manifests
            minikube kubectl -- apply -f k8s/postgres.yaml
            minikube kubectl -- apply -f k8s/web-service.yaml
            minikube kubectl -- apply -f k8s/nginx-configmap.yaml
            minikube kubectl -- apply -f k8s/nginx-service.yaml
            minikube kubectl -- apply -f k8s/web-deployment.yaml
            minikube kubectl -- apply -f k8s/nginx-deployment.yaml

            # 6. Update web deployment image and migration initContainer image to the freshly built tag
            minikube kubectl -- -n sre-bootcamp set image deployment/sre-bootcamp-web \
              web="${WEB_IMAGE}" \
              run-migrations="${WEB_IMAGE}"

            # 7. Wait for web deployment rollout to complete
            minikube kubectl -- -n sre-bootcamp rollout status deployment/sre-bootcamp-web --timeout=300s

            # 8. Reload nginx so any config changes are picked up
            minikube kubectl -- -n sre-bootcamp rollout restart deployment/nginx
            minikube kubectl -- -n sre-bootcamp rollout status deployment/nginx --timeout=180s

            # 9. Print running workloads
            minikube kubectl -- -n sre-bootcamp get pods -o wide