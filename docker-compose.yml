version: "3.9"

services:
  web:
    build: .
    image: sre-bootcamp-web:1.0
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-sre_bootcamp}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: "*"
      PORT: "8000"
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sre_bootcamp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
    networks:
      - backend

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:

networks:
  backend:
    driver: bridge
